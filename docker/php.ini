; Mirrors the shared host's PHP limits so staging fails where production would.
; The app raises memory_limit itself at bootstrap, as it must on the host.
memory_limit = 2M
post_max_size = 10M
upload_max_filesize = 10M
max_execution_time = 30
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
date.timezone = UTC
; Staging never sends mail: anything handed to mail() is appended to a file.
sendmail_path = "/usr/bin/tee -a /srv/var/sendmail.log > /dev/null"
