name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the guard checks every commit's author

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl, dom
          coverage: none

      - name: Lint
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Tests
        run: php tests/run.php

      - name: Publication guard
        env:
          PORTFOLIO_FORBIDDEN_TERMS: ${{ secrets.PORTFOLIO_FORBIDDEN_TERMS }}
        run: php tools/guard.php --fetch
