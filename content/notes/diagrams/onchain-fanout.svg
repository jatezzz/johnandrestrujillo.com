<svg class="note-dg" viewBox="0 0 760 360" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="One funding wallet at the top sends 0.9 POL to five new wallets between 13:25 and 13:27 UTC on 17 September 2026. Each new wallet deploys a byte-identical contract between 13:35:09 and 13:35:46 UTC, labeled team1, team2, team3, team9 and team10. The sample I received reads team2.">
  <defs>
    <marker id="dg-fan-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <text class="head" x="380" y="24" text-anchor="middle">17 SEP 2026 · POLYGON · UTC</text>

  <!-- funder -->
  <rect class="core" x="250" y="40" width="260" height="56" rx="8"/>
  <text class="t-core" x="380" y="66" text-anchor="middle">1 funding wallet</text>
  <text class="t-core-mono" x="380" y="85" text-anchor="middle">13:25–13:27 · 0.9 POL each</text>

  <!-- fan-out lines to the wallets -->
  <line class="ln" x1="380" y1="96" x2="84"  y2="150" marker-end="url(#dg-fan-ah)"/>
  <line class="ln" x1="380" y1="96" x2="232" y2="150" marker-end="url(#dg-fan-ah)"/>
  <line class="ln" x1="380" y1="96" x2="380" y2="150" marker-end="url(#dg-fan-ah)"/>
  <line class="ln" x1="380" y1="96" x2="528" y2="150" marker-end="url(#dg-fan-ah)"/>
  <line class="ln" x1="380" y1="96" x2="676" y2="150" marker-end="url(#dg-fan-ah)"/>

  <!-- new wallets -->
  <g>
    <rect class="b" x="24"  y="152" width="120" height="40" rx="6"/><text class="t" x="84"  y="177" text-anchor="middle">new wallet</text>
    <rect class="b" x="172" y="152" width="120" height="40" rx="6"/><text class="t" x="232" y="177" text-anchor="middle">new wallet</text>
    <rect class="b" x="320" y="152" width="120" height="40" rx="6"/><text class="t" x="380" y="177" text-anchor="middle">new wallet</text>
    <rect class="b" x="468" y="152" width="120" height="40" rx="6"/><text class="t" x="528" y="177" text-anchor="middle">new wallet</text>
    <rect class="b" x="616" y="152" width="120" height="40" rx="6"/><text class="t" x="676" y="177" text-anchor="middle">new wallet</text>
  </g>

  <!-- deploy arrows -->
  <line class="ln" x1="84"  y1="192" x2="84"  y2="226" marker-end="url(#dg-fan-ah)"/>
  <line class="ln" x1="232" y1="192" x2="232" y2="226" marker-end="url(#dg-fan-ah)"/>
  <line class="ln" x1="380" y1="192" x2="380" y2="226" marker-end="url(#dg-fan-ah)"/>
  <line class="ln" x1="528" y1="192" x2="528" y2="226" marker-end="url(#dg-fan-ah)"/>
  <line class="ln" x1="676" y1="192" x2="676" y2="226" marker-end="url(#dg-fan-ah)"/>

  <!-- contracts -->
  <g>
    <rect class="b" x="24"  y="228" width="120" height="70" rx="6"/>
    <text class="head" x="84" y="248" text-anchor="middle">CONTRACT</text>
    <text class="t" x="84" y="268" text-anchor="middle">13:35:09</text>
    <text class="t" x="84" y="288" text-anchor="middle">team1</text>

    <rect class="core" x="172" y="228" width="120" height="70" rx="6"/>
    <text class="t-core-sub" x="232" y="248" text-anchor="middle">CONTRACT</text>
    <text class="t-core-mono" x="232" y="268" text-anchor="middle">13:35:19</text>
    <text class="t-core" x="232" y="290" text-anchor="middle">team2</text>

    <rect class="b" x="320" y="228" width="120" height="70" rx="6"/>
    <text class="head" x="380" y="248" text-anchor="middle">CONTRACT</text>
    <text class="t" x="380" y="268" text-anchor="middle">13:35:28</text>
    <text class="t" x="380" y="288" text-anchor="middle">team3</text>

    <rect class="b" x="468" y="228" width="120" height="70" rx="6"/>
    <text class="head" x="528" y="248" text-anchor="middle">CONTRACT</text>
    <text class="t" x="528" y="268" text-anchor="middle">13:35:37</text>
    <text class="t" x="528" y="288" text-anchor="middle">team9</text>

    <rect class="b" x="616" y="228" width="120" height="70" rx="6"/>
    <text class="head" x="676" y="248" text-anchor="middle">CONTRACT</text>
    <text class="t" x="676" y="268" text-anchor="middle">13:35:46</text>
    <text class="t" x="676" y="288" text-anchor="middle">team10</text>
  </g>

  <text class="t" x="232" y="326" text-anchor="middle">the one my sample reads</text>
  <text class="head" x="380" y="350" text-anchor="middle">BYTE-IDENTICAL CODE · 37 SECONDS FROM FIRST TO LAST</text>
</svg>
